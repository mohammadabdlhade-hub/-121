name: Build HTML to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova and Android Dependencies
      run: |
        npm install -g cordova
        # إعداد بيئة أندرويد لـ Cordova
        sudo apt-get update
        sudo apt-get install -y wget curl

    - name: Create Cordova Project & Build
      run: |
        cordova create myApp com.calc.app Calculator
        cd myApp
        cordova platform add android
        # بناء الـ APK مباشرة
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
